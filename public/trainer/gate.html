<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Trainer</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: #080808; color: #f4f1eb; font: 16px/1.4 system-ui, sans-serif; }
    form { width: min(320px, calc(100vw - 48px)); }
    input, button { width: 100%; height: 48px; border: 1px solid #555; border-radius: 0; font: inherit; }
    input { padding: 0 14px; background: #111; color: inherit; outline-offset: 3px; }
    button { margin-top: 10px; border-color: #f4f1eb; background: #f4f1eb; color: #111; cursor: pointer; }
    a { display: inline-block; margin-top: 16px; color: #aaa; font-size: 13px; }
    [role="status"] { min-height: 1.4em; margin-top: 10px; color: #aaa; font-size: 13px; }
  </style>
</head>
<body>
  <form>
    <input type="password" name="password" placeholder="password" autocomplete="current-password" aria-label="Password" required autofocus>
    <button type="submit">enter</button>
    <div role="status" aria-live="polite"></div>
    <a href="/">connect with strava first</a>
  </form>
  <script>
    const form = document.querySelector("form");
    const status = document.querySelector('[role="status"]');
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const response = await fetch("/api/trainer/unlock", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: form.password.value })
      });
      if (response.ok) return location.replace("/trainer/");
      if (response.status === 403) status.textContent = "sign in with the admin Strava account first";
      else
      status.textContent = response.status === 429 ? "try again later" : "incorrect password";
    });
  </script>
</body>
</html>
