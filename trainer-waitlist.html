<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indoor Trainer · lapped</title>
<meta name="description" content="Structured indoor workouts with ERG in your browser. Join the waitlist.">
<!-- Served to anyone who isn't approved for the trainer, so it is self-contained: the trainer's own files stay private. -->
<script>try{if(localStorage.getItem("lapped-theme")==="dark")document.documentElement.dataset.theme="dark"}catch{}</script>
<link rel="preload" href="/fonts/archivo/Archivo.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face { font-family: "Archivo"; src: url("/fonts/archivo/Archivo.ttf") format("truetype"); font-weight: 100 900; font-display: block; }
  :root {
    --bg: rgb(244,244,244); --ink: rgb(20,20,20); --muted: rgb(107,107,107); --line: rgba(0,0,0,.12);
    --accent: rgb(219,128,15); --on-accent: rgba(0,0,0,.85); --bad: rgb(217,51,84);
    --z1: rgb(190,190,190); --z2: rgb(40,150,75); --z4: rgb(224,168,0);
    --font: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: light;
  }
  [data-theme="dark"] {
    --bg: #000; --ink: #fff; --muted: rgb(158,158,163); --line: rgba(255,255,255,.12);
    --accent: rgb(255,180,84); --bad: rgb(255,123,145);
    --z1: rgb(90,90,90); --z2: rgb(92,214,120); --z4: rgb(255,214,69);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 400 14px var(--font); -webkit-font-smoothing: antialiased; }

  main { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 32px; min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; }
  nav { display: flex; justify-content: space-between; align-items: center; height: 72px; }
  .wordmark { color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: -.04em; text-decoration: none; }

  /* Headline left, the workout and the form right. */
  .grid { display: grid; grid-template-columns: 7fr 5fr; gap: 0 64px; align-content: center; padding: 24px 0 12vh; } /* extra room below lifts the block to the optical centre */
  h1 { font: 600 clamp(48px, 6.6vw, 88px)/.95 var(--font); letter-spacing: -.035em; margin: 0; }
  /* Each word comes into focus on its own, quickly one after another (fast in, slow out). */
  h1 span { display: inline-block; will-change: transform, opacity, filter; animation: focus-in .8s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--i) * 55ms); }
  @keyframes focus-in { from { opacity: 0; filter: blur(5px); transform: translate3d(0, 10px, 0); } to { opacity: 1; filter: blur(0); transform: none; } }
  .side { display: flex; flex-direction: column; gap: 28px; border-top: 1px solid var(--ink); padding-top: 18px; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 380px; }

  /* The workout profile, flat blocks in zone colours. They grow once on load, then stay put. */
  .profile { height: 56px; overflow: hidden; padding-top: 8px; box-sizing: content-box; }
  .bars { position: absolute; inset: 8px 0 0; display: flex; align-items: flex-end; gap: 2px; }
  .bars i { will-change: transform; flex: var(--w); height: var(--h); background: var(--c); transform-origin: bottom; animation: rise .9s var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
  @keyframes rise { from { transform: scaleY(0); } }
  /* Then a ride line sweeps the workout once, fast in and slow out, and fades at the finish. */
  .profile { position: relative; }
  .cursor { position: absolute; top: 0; bottom: 0; left: 0; right: 0; pointer-events: none; opacity: 0; will-change: transform, opacity; animation: sweep 2.8s cubic-bezier(.16,1,.3,1) .9s forwards; }
  .cursor::before { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 1.5px; background: var(--ink); }
  @keyframes sweep { 0% { transform: translate3d(0,0,0); opacity: 0; } 4% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translate3d(100%,0,0); opacity: 0; } }

  button { font: 600 14px var(--font); border-radius: 2px; min-height: 44px; padding: 0 20px; cursor: pointer; border: 0; background: var(--accent); color: var(--on-accent); transition: filter .15s, opacity .15s; }
  button:hover { filter: brightness(1.06); }
  button:active { opacity: .85; }
  button:disabled { opacity: .55; cursor: default; filter: none; }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  input:focus-visible { outline: none; } /* the field's own hairline turns ink on focus instead */

  /* The button opens into the form in place: height eases open, fields fade in with it. */
  .sheet { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
  .sheet.open { grid-template-rows: 1fr; }
  .sheet > div { overflow: hidden; }
  form { display: grid; gap: 16px; padding: 2px; opacity: 0; transition: opacity .35s ease .1s; }
  .sheet.open form { opacity: 1; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  label small { font-size: 12px; margin-left: 6px; opacity: .7; }
  input { height: 44px; padding: 0 12px; background: transparent; border: 1px solid var(--line); border-radius: 2px; color: var(--ink); font: 400 15px var(--font); outline: none; width: 100%; transition: border-color .15s; }
  input::placeholder { color: var(--muted); opacity: .6; }
  input:focus { border-color: var(--ink); }
  input.bad { border-color: var(--bad); }
  form button { justify-self: start; }
  .status { min-height: 18px; font-size: 13px; color: var(--bad); }

  .done { border-top: 1px solid var(--line); padding-top: 14px; animation: fade .4s ease both; }
  .done strong { display: block; font-weight: 600; font-size: 16px; letter-spacing: -.01em; margin-bottom: 3px; }
  .done strong::before { content: ""; display: inline-block; width: 8px; height: 8px; background: var(--z2); margin-right: 10px; vertical-align: 2px; }
  .done span { color: var(--muted); font-size: 13px; }
  @keyframes fade { from { opacity: 0; } }

  footer { display: flex; gap: 18px; border-top: 1px solid var(--line); padding: 18px 0 24px; font-size: 12px; }
  footer a { color: var(--muted); text-decoration: none; transition: color .15s; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 760px) {
    main { padding: 0 16px; }
    .grid { grid-template-columns: 1fr; gap: 32px; align-content: start; padding-top: 24px; }
    h1 { font-size: clamp(40px, 12vw, 56px); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <nav><a class="wordmark" href="/">lapped</a></nav>

  <section class="grid">
    <h1 id="headline">Ride structured workouts in your browser.</h1>
    <script>{ // split into words before first paint, so the full line never flashes
  const headline = document.getElementById("headline");
  headline.setAttribute("aria-label", headline.textContent);
  headline.innerHTML = headline.textContent.split(" ").map((word, i) => `<span aria-hidden="true" style="--i:${i}">${word}</span>`).join(" ");
  }</script>
    <div class="side">
      <div class="profile" aria-hidden="true"><div class="bars" id="bars"></div><span class="cursor"></span></div>
      <p>ERG control for smart trainers, heart rate, and rides that upload straight to Strava. Opening soon.</p>

      <div id="cta"><button id="join" type="button">Join waitlist</button></div>

      <div class="sheet" id="sheet">
        <div>
          <form id="form" novalidate aria-label="Join the waitlist">
            <label>Name<input name="name" autocomplete="name" maxlength="80" required tabindex="-1"></label>
            <label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required tabindex="-1"></label>
            <label><span>Strava link<small>optional</small></span><input name="stravaUrl" type="url" inputmode="url" maxlength="500" placeholder="strava.com/athletes/…" tabindex="-1"></label>
            <button type="submit" tabindex="-1">Join waitlist</button>
            <span class="status" id="status" aria-live="polite"></span>
          </form>
        </div>
      </div>

      <div class="done" id="done" hidden role="status">
        <strong>You're on the list.</strong><span>We'll email you when the trainer opens.</span>
      </div>
    </div>
  </section>

  <footer><a href="/">lapped.fit</a><a href="/privacy.html">privacy</a></footer>
</main>
<script>
  // A threshold workout in zone colours, like the trainer's workout thumbnails: [zone colour, height %, width].
  const blocks = [["z2", 34, 3], ["z2", 44, 3], ["z2", 54, 3], ["z4", 100, 7], ["z1", 30, 2], ["z4", 100, 7], ["z1", 30, 2], ["z4", 100, 7], ["z1", 30, 2], ["z4", 100, 7], ["z1", 24, 4]];
  document.getElementById("bars").innerHTML = blocks.map(([zone, h, w], i) => `<i style="--c:var(--${zone});--h:${h}%;--w:${w};--i:${i}"></i>`).join("");

  const sheet = document.getElementById("sheet"), form = document.getElementById("form"), cta = document.getElementById("cta"), status = document.getElementById("status");
  document.getElementById("join").addEventListener("click", () => {
    cta.hidden = true;
    sheet.classList.add("open");
    form.querySelectorAll("[tabindex]").forEach((el) => el.removeAttribute("tabindex"));
    setTimeout(() => form.elements.name.focus({ preventScroll: true }), 180);
  });

  const fail = (input, message) => {
    status.textContent = message;
    if (input) { input.classList.add("bad"); input.focus(); }
  };
  form.addEventListener("input", (event) => { event.target.classList.remove("bad"); status.textContent = ""; });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const { name, email, stravaUrl } = form.elements;
    if (name.value.trim().length < 2) return fail(name, "Please enter your name.");
    if (!email.value || !email.checkValidity()) return fail(email, "Please enter a valid email.");
    let link = stravaUrl.value.trim();
    if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;   // accept "strava.com/athletes/…" as typed
    const button = form.querySelector("button");
    button.disabled = true; button.textContent = "Joining…"; status.textContent = "";
    try {
      const response = await fetch("/api/waitlist", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: name.value, email: email.value, stravaUrl: link, source: "trainer" }) });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || "Couldn't join right now. Try again.");
      sheet.hidden = true;
      const done = document.getElementById("done");
      if (body.existing) done.querySelector("strong").textContent = "You're already on the list.";
      done.hidden = false;
    } catch (error) {
      fail(/strava/i.test(error.message) ? stravaUrl : null, error.message);
      button.disabled = false; button.textContent = "Join waitlist";
    }
  });
</script>
</body>
</html>
