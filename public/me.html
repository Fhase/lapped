<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lapped — My laps</title>
  <meta name="description" content="Your private Lapped stats." />
  <link rel="stylesheet" href="/styles.css" />
  <style>.me{padding:98px 0 56px;max-width:900px}.me h1{font-size:clamp(58px,10vw,104px);margin-bottom:18px}.me .intro-copy{color:var(--muted);margin:0 0 52px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}.stat{padding:24px 0 28px}.stat:nth-child(even){border-left:1px solid var(--ink);padding-left:28px}.stat:nth-child(n+3){border-top:1px solid var(--ink)}.stat strong{display:block;font:400 clamp(48px,7vw,76px)/.85 Georgia,"Times New Roman",serif;letter-spacing:-.08em}.stat strong.fastest{font-size:clamp(38px,5vw,56px);letter-spacing:-.065em}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:15px}.stat small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.ytd-action{margin-top:28px}.ytd-action button{font:500 14px Manrope,Arial,sans-serif}.status{color:var(--muted);font-size:13px;min-height:20px;margin:13px 0 0}.privacy-note{color:var(--muted);font-size:13px;line-height:1.5;margin-top:58px;max-width:490px}.privacy-note a{color:var(--ink);text-underline-offset:3px}.footer{margin-top:70px;color:var(--muted);font-size:12px}.footer a{color:inherit;text-underline-offset:3px}@media(max-width:540px){.me{padding:72px 0 42px}.stats{grid-template-columns:1fr}.stat:nth-child(even){border-left:0;padding-left:0}.stat+.stat{border-top:1px solid var(--ink)}}</style>
</head>
<body>
  <main>
    <nav><a class="wordmark" href="/">Lapped</a><div class="nav-right"><a class="github-link" href="/">Home</a><span id="theme-label">light mode</span><label class="theme-toggle"><input id="theme-toggle" type="checkbox" aria-label="Use light mode" checked /><span class="toggle-track"><i></i></span></label></div></nav>
    <section class="me"><h1 id="name">My laps.</h1><p class="intro-copy">Private to the Strava account currently connected to lapped.</p><div class="stats" id="stats" hidden><div class="stat"><strong id="lifetime">—</strong><span>all-time laps</span><small id="lifetime-km">— km</small></div><div class="stat"><strong id="ytd">—</strong><span id="ytd-label">2026 laps</span><small id="ytd-km">— km</small></div><div class="stat"><strong id="since-joining">—</strong><span>laps since joining</span><small id="since-joining-km">— km</small></div><div class="stat"><strong class="fastest" id="fastest">—</strong><span>fastest lap since joining</span></div></div><div class="ytd-action" id="ytd-action" hidden><button id="load-ytd" type="button">Load year-to-date laps</button><p class="status" id="status"></p></div><p class="status" id="error"></p><p class="privacy-note">Lapped reads and displays only your own Strava data here. <a href="/privacy.html">Privacy</a></p></section>
  </main>
  <script type="module" src="/me.js"></script>
</body>
</html>
