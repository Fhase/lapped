<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Indoor Trainer · lapped</title>
<meta name="description" content="Structured indoor workouts with ERG in your browser. Join the waitlist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<!-- Served to anyone who isn't approved for the trainer, so it is self-contained: the trainer's own files stay private. -->
<style>
  :root {
    --bg: #000; --panel: rgb(19,19,19); --field: rgb(11,11,11); --border: rgba(255,255,255,.10);
    --muted: rgb(158,158,163); --ink: #fff; --accent: rgb(255,180,84); --on-accent: rgba(0,0,0,.85); --bad: rgb(255,123,145);
    --z1: rgb(204,204,204); --z2: rgb(92,214,120); --z4: rgb(255,214,69);
    --font: "Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font: 500 14px var(--font); -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; padding: 40px 16px; overflow-x: hidden;
  }
  /* A slow threshold-coloured glow from below, like the trainer's zone glow. */
  body::before {
    content: ""; position: fixed; inset: auto -20% -45% -20%; height: 80%; pointer-events: none;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255,214,69,.13), transparent 70%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .55; transform: scale(1.06); } }

  main { position: relative; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 26px; }

  /* Workout profile: blocks rise in, then a ride cursor sweeps across once (fast start, gentle finish), lighting the whole workout, and fades out. */
  .profile { position: relative; height: 64px; }
  .bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px; }
  .bars i { flex: var(--w); height: var(--h); background: var(--c); border-radius: 3px; transform-origin: bottom; animation: rise .7s var(--ease) both; animation-delay: calc(var(--i) * 45ms + 120ms); }
  .bars.dim i { opacity: .32; }
  .bars.lit { clip-path: inset(0 100% 0 0); animation: ride 3.2s cubic-bezier(.16,1,.3,1) 1.1s forwards; }
  .bars.lit i { animation: none; }
  .cursor { position: absolute; top: -6px; bottom: 0; width: 1.5px; background: var(--ink); border-radius: 1px; left: 0; opacity: 0; animation: cursor 3.2s cubic-bezier(.16,1,.3,1) 1.1s forwards; box-shadow: 0 0 10px rgba(255,255,255,.5); }
  @keyframes rise { from { transform: scaleY(0); opacity: 0; } }
  @keyframes ride { to { clip-path: inset(0 0 0 0); } }
  @keyframes cursor { 0% { left: 0; opacity: 0; } 5% { opacity: .9; } 92% { opacity: .9; } 100% { left: 100%; opacity: 0; } }

  h1 { font: 700 44px/1.04 var(--font); letter-spacing: -.02em; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 380px; }
  .in { animation: up .8s var(--ease) both; animation-delay: var(--d, 0ms); }
  @keyframes up { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }

  button { font: 600 14px var(--font); border-radius: 9px; min-height: 44px; padding: 0 20px; cursor: pointer; border: 1px solid rgba(0,0,0,.12); background: var(--accent); color: var(--on-accent); transition: transform .2s var(--ease), box-shadow .2s var(--ease), opacity .15s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 24px -8px rgba(255,180,84,.55); }
  button:active { transform: translateY(0); opacity: .8; }
  button:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The button opens into the form in place: height and content ease in together. */
  .sheet { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
  .sheet.open { grid-template-rows: 1fr; }
  .sheet > div { overflow: hidden; }
  form { display: grid; gap: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-top: 2px; }
  .sheet.open form > * { animation: up .55s var(--ease) both; }
  .sheet.open form > *:nth-child(2) { animation-delay: 60ms; } .sheet.open form > *:nth-child(3) { animation-delay: 120ms; }
  .sheet.open form > *:nth-child(4) { animation-delay: 180ms; } .sheet.open form > *:nth-child(5) { animation-delay: 220ms; }
  label { display: grid; gap: 7px; font: 500 12px var(--font); color: var(--muted); }
  label small { opacity: .65; font-size: 11px; margin-left: 4px; }
  input { height: 44px; padding: 0 13px; background: var(--field); border: 1px solid var(--border); border-radius: 8px; color: var(--ink); font: 500 15px var(--font); outline: none; width: 100%; transition: border-color .2s, background .2s; }
  input::placeholder { color: rgba(158,158,163,.5); }
  input:focus { border-color: rgba(255,180,84,.7); background: rgb(14,14,14); }
  input.bad { border-color: var(--bad); outline-color: var(--bad); animation: nudge .3s; }
  @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .status { min-height: 18px; font-size: 13px; color: var(--bad); }

  .done { display: flex; align-items: center; gap: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; animation: up .6s var(--ease) both; }
  .done svg { flex: none; width: 34px; height: 34px; }
  .done circle { fill: rgba(92,214,120,.14); }
  .done path { fill: none; stroke: var(--z2); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .5s var(--ease) .25s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .done strong { display: block; font: 700 16px var(--font); margin-bottom: 2px; }
  .done span { color: var(--muted); font-size: 13px; }

  footer { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  footer a { color: var(--muted); text-decoration: none; transition: color .2s; }
  footer a:hover { color: var(--ink); }

  @media (max-width: 480px) { h1 { font-size: 36px; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .bars.lit, .cursor { display: none; }
    .bars.dim i { opacity: 1; }
    .done path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<main>
  <div class="profile in" aria-hidden="true">
    <div class="bars dim" id="bars"></div>
    <div class="bars lit" id="lit"></div>
    <span class="cursor"></span>
  </div>
  <h1 class="in" style="--d:120ms">Ride structured workouts in your browser.</h1>
  <p class="in" style="--d:220ms">ERG control for smart trainers, heart rate, and rides that upload straight to Strava. Opening soon.</p>

  <div class="in" style="--d:320ms" id="cta"><button id="join" type="button">Join waitlist</button></div>

  <div class="sheet" id="sheet">
    <div>
      <form id="form" novalidate aria-label="Join the waitlist">
        <label>Name<input name="name" autocomplete="name" maxlength="80" required tabindex="-1"></label>
        <label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required tabindex="-1"></label>
        <label><span>Strava link<small>optional</small></span><input name="stravaUrl" type="url" inputmode="url" maxlength="500" placeholder="strava.com/athletes/…" tabindex="-1"></label>
        <button type="submit" tabindex="-1">Join waitlist</button>
        <span class="status" id="status" aria-live="polite"></span>
      </form>
    </div>
  </div>

  <div class="done" id="done" hidden role="status">
    <svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="17"/><path d="M11 17.5l4 4 8-8.5"/></svg>
    <div><strong>You're on the list.</strong><span>We'll email you when the trainer opens.</span></div>
  </div>

  <footer class="in" style="--d:420ms"><a href="/">lapped.fit</a><a href="/privacy.html">privacy</a></footer>
</main>
<script>
  // A threshold workout in zone colours, like the trainer's workout thumbnails: [zone colour, height %, width].
  const blocks = [["z2", 34, 3], ["z2", 44, 3], ["z2", 54, 3], ["z4", 100, 7], ["z1", 30, 2], ["z4", 100, 7], ["z1", 30, 2], ["z4", 100, 7], ["z1", 30, 2], ["z4", 100, 7], ["z1", 24, 4]];
  const bars = blocks.map(([zone, h, w], i) => `<i style="--c:var(--${zone});--h:${h}%;--w:${w};--i:${i}"></i>`).join("");
  document.getElementById("bars").innerHTML = bars;
  document.getElementById("lit").innerHTML = bars;

  const sheet = document.getElementById("sheet"), form = document.getElementById("form"), cta = document.getElementById("cta"), status = document.getElementById("status");
  document.getElementById("join").addEventListener("click", () => {
    cta.hidden = true;
    sheet.classList.add("open");
    form.querySelectorAll("[tabindex]").forEach((el) => el.removeAttribute("tabindex"));
    setTimeout(() => form.elements.name.focus({ preventScroll: true }), 180);
  });

  const fail = (input, message) => {
    status.textContent = message;
    if (input) { input.classList.remove("bad"); void input.offsetWidth; input.classList.add("bad"); input.focus(); }
  };
  form.addEventListener("input", (event) => { event.target.classList.remove("bad"); status.textContent = ""; });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const { name, email, stravaUrl } = form.elements;
    if (name.value.trim().length < 2) return fail(name, "Please enter your name.");
    if (!email.value || !email.checkValidity()) return fail(email, "Please enter a valid email.");
    let link = stravaUrl.value.trim();
    if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;   // accept "strava.com/athletes/…" as typed
    const button = form.querySelector("button");
    button.disabled = true; button.textContent = "Joining…"; status.textContent = "";
    try {
      const response = await fetch("/api/waitlist", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: name.value, email: email.value, stravaUrl: link, source: "trainer" }) });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || "Couldn't join right now. Try again.");
      sheet.hidden = true;
      const done = document.getElementById("done");
      if (body.existing) done.querySelector("strong").textContent = "You're already on the list.";
      done.hidden = false;
    } catch (error) {
      fail(/strava/i.test(error.message) ? stravaUrl : null, error.message);
      button.disabled = false; button.textContent = "Join waitlist";
    }
  });
</script>
</body>
</html>
